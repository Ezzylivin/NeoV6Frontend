# File: netlify.toml

# Build settings for your frontend
[build]
  command = "npm run build"
  publish = "dist" # Or "build", depending on your React setup

# Proxy rule to the Render backend
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_RENDER_BACKEND_URL.onrender.com/api/:splat"
  status = 200 # This makes it a proxy/rewrite

# SPA fallback rule for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
