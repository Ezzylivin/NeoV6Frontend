<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Exchanges</title>
</head>
<body>
  <h1>Available US Exchanges</h1>
  <ul id="exchange-list"></ul>

  <script>
    const API_URL = "https://neov6backend.onrender.com/api"; // ✅ production backend

    async function loadExchanges() {
      try {
        const response = await fetch(`${API_URL}/exchanges`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();

        const ul = document.getElementById("exchange-list");
        ul.innerHTML = "";

        for (const [exchange, symbols] of Object.entries(data)) {
          const li = document.createElement("li");
          li.textContent = `${exchange.toUpperCase()}: ${symbols.join(", ")}`;
          ul.appendChild(li);
        }
      } catch (err) {
        console.error("Failed to load exchanges:", err);
        const ul = document.getElementById("exchange-list");
        ul.innerHTML = `<li style="color:red;">Error fetching exchanges: ${err.message}</li>`;
      }
    }

    loadExchanges();
  </script>
</body>
</html>
